# 本仓库的 CI 定义。GitHub 只识别 .github/workflows/ 下的文件，
# 而当前 gh 令牌没有 workflow 权限（推送该目录会被服务器拒绝），所以先放在 ci/。
# 启用方法（任选其一）：
#   gh auth refresh -s workflow     # 给令牌补上 workflow 作用域
#   git mv ci/ci.yml .github/workflows/ci.yml && git commit -m 'ci: 启用 GitHub Actions' && git push
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装依赖（只装 NumPy 主内核，torch 是可选 extra）
        run: uv sync
      - name: 测试
        run: uv run pytest -q
      - name: 代码风格
        run: uv run ruff check app tests tools
      - name: 10 个算法自检（visual 齐全、无 NaN/Inf）
        run: uv run python -m tools.probe

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 全部公式都能被 KaTeX 排版（严格模式，抓坏 LaTeX）
        working-directory: frontend
        run: node ../tools/check_tex.mjs
      - name: 构建
        working-directory: frontend
        run: npm run build
